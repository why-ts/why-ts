name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          # pnpm-lock.yaml is lockfileVersion '9.0' (written by pnpm 9+;
          # confirmed pnpm 10.18.2 locally). pnpm 8 cannot read a v9
          # lockfile at all ("Ignoring not compatible lockfile" ->
          # ERR_PNPM_NO_LOCKFILE with --frozen-lockfile) -- discovered via a
          # real failing GitHub Actions run on this chunk's throwaway PR,
          # not assumed. Bumped to match.
          version: 10

      # Cache node_modules
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # Root `lint` script (`eslint libs examples --ext .ts`) lints every
      # library and example in one pass; it is not a per-package script, so
      # it must run once at the workspace root rather than via `-r`
      # (pnpm's recursive run excludes the workspace root by default, and
      # there is no per-package `lint` script for `--if-present` to find).
      - run: pnpm --if-present run lint
      - run: pnpm -r --if-present run test
      # `examples/cli` intentionally has no `build` script (non-published
      # manual demo app, see roadmap Decisions) so `--if-present` silently
      # skips it here — accepted, not a bug.
      - run: pnpm -r --if-present run build
